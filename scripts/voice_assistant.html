<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2026 - Ultra Voice Assistant</title>
    <style>
        :root {
            --bg-color: #0f0f10;
            --container-bg: #1a1a1c;
            --text-color: #f0f0f2;
            --accent-color: #00e5ff;
            --accent-hover: #00b8d4;
            --status-color: #888;
            --input-bg: #252529;
            --error-color: #ff5252;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 480px;
            border: 1px solid #333;
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
            background: linear-gradient(90deg, #00e5ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .settings {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #3d3d42;
            background: var(--input-bg);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .slider-group {
            flex: 1;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            appearance: none;
            margin-top: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: #000;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }

        .mic-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
        }

        .mic-btn.listening {
            background: var(--error-color);
            animation: pulse 1s infinite alternate;
            box-shadow: 0 0 30px rgba(255, 82, 82, 0.5);
        }

        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 20px rgba(255, 82, 82, 0.3); }
            to { transform: scale(1.15); box-shadow: 0 0 40px rgba(255, 82, 82, 0.6); }
        }

        #status {
            margin-top: 12px;
            font-size: 13px;
            color: var(--status-color);
            height: 18px;
        }

        .output-box {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #2d2d30;
            font-size: 15px;
            line-height: 1.6;
        }

        .msg-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        .user-txt { color: var(--accent-color); }
        .ai-txt { color: #fff; }

        .refresh-link {
            font-size: 11px;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            margin-top: 4px;
            align-self: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voice Assistant 2026</h1>

        <div class="settings">
            <div class="field">
                <label>OpenRouter API Key</label>
                <input type="password" id="api-key" placeholder="Enter sk-or-v1-..." autocomplete="off">
            </div>

            <div class="field">
                <label>AI Model (2026 Free Tier)</label>
                <select id="model-select">
                    <option value="openrouter/free">Auto-Select Free Model</option>
                    <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air (Free)</option>
                    <option value="nvidia/nemotron-3-super:free">Nemotron 3 Super (Free)</option>
                    <option value="openai/gpt-oss-120b:free">GPT-OSS 120B (Free)</option>
                    <option value="openai/gpt-oss-20b:free">GPT-OSS 20B (Free)</option>
                    <option value="poolside/laguna-m.1:free">Laguna M.1 Coding (Free)</option>
                    <option value="google/gemma-4-31b:free">Gemma 4 31B (Free)</option>
                    <option value="google/gemma-4-26b-a4b:free">Gemma 4 26B MoE (Free)</option>
                    <option value="nvidia/nemotron-3-nano-omni:free">Nemotron Nano Omni (Free)</option>
                    <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free)</option>
                </select>
                <div class="refresh-link" id="refresh-models">Refresh list from API</div>
            </div>

            <div class="controls">
                <div class="slider-group">
                    <label>Voice Speed: <span id="speed-val">1.0</span>x</label>
                    <input type="range" id="voice-speed" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
                <div class="slider-group">
                    <label>Pitch: <span id="pitch-val">1.0</span></label>
                    <input type="range" id="voice-pitch" min="0.5" max="1.5" step="0.1" value="1.0">
                </div>
            </div>
        </div>

        <div class="mic-section">
            <button id="talk-btn" class="mic-btn">🎤</button>
            <div id="status">Ready</div>
        </div>

        <div class="output-box" id="output">
            <span style="color: #666;">Ready to listen...</span>
        </div>
    </div>

    <script>
        const btn = document.getElementById('talk-btn');
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const apiKeyInput = document.getElementById('api-key');
        const modelSelect = document.getElementById('model-select');
        const speedInput = document.getElementById('voice-speed');
        const pitchInput = document.getElementById('voice-pitch');
        const speedVal = document.getElementById('speed-val');
        const pitchVal = document.getElementById('pitch-val');
        const refreshBtn = document.getElementById('refresh-models');

        // State & LocalStorage
        apiKeyInput.value = localStorage.getItem('or_key') || '';
        speedInput.value = localStorage.getItem('v_speed') || '1.0';
        pitchInput.value = localStorage.getItem('v_pitch') || '1.0';
        speedVal.innerText = speedInput.value;
        pitchVal.innerText = pitchInput.value;

        apiKeyInput.onchange = () => localStorage.setItem('or_key', apiKeyInput.value);
        speedInput.oninput = () => { speedVal.innerText = speedInput.value; localStorage.setItem('v_speed', speedInput.value); };
        pitchInput.oninput = () => { pitchVal.innerText = pitchInput.value; localStorage.setItem('v_pitch', pitchInput.value); };

        refreshBtn.onclick = fetchModels;

        async function fetchModels() {
            if (!apiKeyInput.value) return;
            status.innerText = "Fetching models...";
            try {
                const res = await fetch("https://openrouter.ai/api/v1/models");
                const json = await res.json();
                const free = json.data.filter(m => m.id.includes(':free'));
                if (free.length > 0) {
                    const current = modelSelect.value;
                    modelSelect.innerHTML = '<option value="openrouter/free">Auto-Select Free Model</option>';
                    free.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = `${m.name || m.id} (Free)`;
                        modelSelect.appendChild(opt);
                    });
                    modelSelect.value = current;
                    status.innerText = "List updated!";
                }
            } catch (e) { status.innerText = "Fetch failed."; }
        }

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
            status.innerText = "Browser doesn't support speech.";
            btn.disabled = true;
        } else {
            const rec = new Recognition();
            let listening = false;

            btn.onclick = () => {
                if (!apiKeyInput.value) { alert("Enter API Key"); return; }
                if (listening) rec.stop(); else rec.start();
            };

            rec.onstart = () => {
                listening = true;
                btn.classList.add('listening');
                btn.innerText = "🛑";
                status.innerText = "Listening...";
                window.speechSynthesis.cancel();
            };

            rec.onend = () => {
                listening = false;
                btn.classList.remove('listening');
                btn.innerText = "🎤";
                if (status.innerText === "Listening...") status.innerText = "Ready";
            };

            rec.onresult = async (e) => {
                const text = e.results[0][0].transcript;
                output.innerHTML = `<span class="msg-label user-txt">You</span>${text}`;
                status.innerText = "Thinking...";

                try {
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKeyInput.value}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: modelSelect.value,
                            messages: [
                                { role: "system", content: "You are a concise voice assistant. Max 2 sentences." },
                                { role: "user", content: text }
                            ]
                        })
                    });
                    const data = await res.json();
                    const reply = data.choices[0].message.content;
                    output.innerHTML += `<div style="margin-top:10px;"><span class="msg-label ai-txt">Assistant</span>${reply}</div>`;
                    speak(reply);
                } catch (err) {
                    status.innerText = "API Error";
                }
            };
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            utter.voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices[0];
            utter.rate = parseFloat(speedInput.value);
            utter.pitch = parseFloat(pitchInput.value);
            utter.onstart = () => status.innerText = "Speaking...";
            utter.onend = () => status.innerText = "Ready";
            window.speechSynthesis.speak(utter);
        }
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
